services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: massage
      POSTGRES_PASSWORD: massage
      POSTGRES_DB: massage
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U massage -d massage"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
