name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: massage
          POSTGRES_PASSWORD: massage
          POSTGRES_DB: massage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U massage -d massage_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI: true
      AUTH_SECRET: ci-test-secret-not-for-production
      AUTH_URL: http://localhost:3000
      EMAIL_PROVIDER: log
      DATABASE_URL: postgresql://massage:massage@localhost:5432/massage_test?schema=public
      TEST_DATABASE_URL: postgresql://massage:massage@localhost:5432/massage_test?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate test database
        run: npm run db:migrate:test

      - name: Lint
        run: npm run lint

      - name: Unit and integration tests
        run: npm test
